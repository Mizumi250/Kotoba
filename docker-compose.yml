# Generated by export-docker.js for "kotoba". Start with:
#   docker compose --env-file deploy.env up -d --build
name: kotoba
services:
  proxy:
    build:
      context: ./docker
      dockerfile: Dockerfile.proxy
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-8080}:80"
      - "${HTTPS_PORT:-8443}:443"
    environment:
      SITE_ADDRESS: "${SITE_ADDRESS:-:80}"
    volumes:
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - backend
      - frontend
  backend:
    build:
      context: ./backend
    image: kotoba-backend:latest
    restart: unless-stopped
    environment:
      APP_NAME: "kotoba"
      APP_ENV: "production"
      APP_DEBUG: "false"
      APP_URL: "${PUBLIC_URL:-http://localhost:8080}"
      APP_KEY: "${APP_KEY:-}"
      LOG_CHANNEL: "stderr"
      DB_CONNECTION: "sqlite"
      DB_DATABASE: "database/arkzen/kotoba.sqlite"
      SESSION_DRIVER: "file"
      CACHE_STORE: "file"
      QUEUE_CONNECTION: "database"
      BROADCAST_CONNECTION: "reverb"
      MAIL_MAILER: "${MAIL_MAILER:-log}"
      MAIL_FROM_ADDRESS: "${MAIL_FROM_ADDRESS:-hello@example.com}"
      ARKZEN_ENGINE_SECRET: "${ARKZEN_ENGINE_SECRET:?Set ARKZEN_ENGINE_SECRET in deploy.env}"
      ARKZEN_DB_DRIVER: "sqlite"
      ARKZEN_DB_PREFIX: "pluff"
      REVERB_APP_ID: "${REVERB_APP_ID:-pluff-app}"
      REVERB_APP_KEY: "${REVERB_APP_KEY:-arkzen-key}"
      REVERB_APP_SECRET: "${REVERB_APP_SECRET:-pluff-secret}"
      REVERB_HOST: "reverb"
      REVERB_PORT: "8081"
      REVERB_SCHEME: "http"
      REVERB_SERVER_HOST: "0.0.0.0"
      REVERB_SERVER_PORT: "8081"
      RUN_MIGRATIONS: "1"
    volumes:
      - backend-database:/app/database
      - backend-storage:/app/storage
  reverb:
    build:
      context: ./backend
    image: kotoba-backend:latest
    restart: unless-stopped
    command: ["php", "artisan", "reverb:start", "--host=0.0.0.0", "--port=8081"]
    environment:
      APP_NAME: "kotoba"
      APP_ENV: "production"
      APP_DEBUG: "false"
      APP_URL: "${PUBLIC_URL:-http://localhost:8080}"
      APP_KEY: "${APP_KEY:-}"
      LOG_CHANNEL: "stderr"
      DB_CONNECTION: "sqlite"
      DB_DATABASE: "database/arkzen/kotoba.sqlite"
      SESSION_DRIVER: "file"
      CACHE_STORE: "file"
      QUEUE_CONNECTION: "database"
      BROADCAST_CONNECTION: "reverb"
      MAIL_MAILER: "${MAIL_MAILER:-log}"
      MAIL_FROM_ADDRESS: "${MAIL_FROM_ADDRESS:-hello@example.com}"
      ARKZEN_ENGINE_SECRET: "${ARKZEN_ENGINE_SECRET:?Set ARKZEN_ENGINE_SECRET in deploy.env}"
      ARKZEN_DB_DRIVER: "sqlite"
      ARKZEN_DB_PREFIX: "pluff"
      REVERB_APP_ID: "${REVERB_APP_ID:-pluff-app}"
      REVERB_APP_KEY: "${REVERB_APP_KEY:-arkzen-key}"
      REVERB_APP_SECRET: "${REVERB_APP_SECRET:-pluff-secret}"
      REVERB_HOST: "reverb"
      REVERB_PORT: "8081"
      REVERB_SCHEME: "http"
      REVERB_SERVER_HOST: "0.0.0.0"
      REVERB_SERVER_PORT: "8081"
    volumes:
      - backend-database:/app/database
      - backend-storage:/app/storage
    depends_on:
      - backend
  frontend:
    build:
      context: ./frontend
      args:
        REALTIME_HOST: "${REALTIME_HOST:-localhost}"
        REALTIME_PORT: "${REALTIME_PORT:-${HTTP_PORT:-8080}}"
        REALTIME_SCHEME: "${REALTIME_SCHEME:-ws}"
        REVERB_APP_KEY: "${REVERB_APP_KEY:-arkzen-key}"
    image: kotoba-frontend:latest
    restart: unless-stopped
volumes:
  caddy-data:
  caddy-config:
  backend-database:
  backend-storage:
